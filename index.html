<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mini Maze Muncher</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrap">
    <h1>Mini Maze Muncher</h1>
    <section class="hud" aria-label="Game status">
      <div>Score: <strong id="score">0</strong></div>
      <div>Lives: <strong id="lives">3</strong></div>
      <div>Level: <strong id="level">1</strong></div>
      <button id="restart" type="button">Restart</button>
    </section>

    <section class="ai-lab" aria-label="AI difficulty controls">
      <div class="ai-lab__bar">
        <h2>AI Lab</h2>
        <div class="ai-actions">
          <button id="classic-ai" class="secondary" type="button">Classic</button>
          <button id="all-ai" class="secondary" type="button">All On</button>
          <button id="pretrain-pacman" class="secondary" type="button">Pretrain Pac-Man</button>
          <button id="reset-ai-memory" class="secondary danger" type="button">Reset Memory</button>
        </div>
      </div>

      <div class="ai-toggles" aria-label="AI feature toggles">
        <button type="button" class="toggle" data-ai-toggle="patternMemory" aria-pressed="true">Pattern Memory</button>
        <button type="button" class="toggle" data-ai-toggle="behaviorClusters" aria-pressed="true">Clusters</button>
        <button type="button" class="toggle" data-ai-toggle="neuralNetwork" aria-pressed="true">Neural Net</button>
        <button type="button" class="toggle" data-ai-toggle="nnLogs" aria-pressed="true">NN Logs</button>
        <button type="button" class="toggle" data-ai-toggle="autoPacman" aria-pressed="false">Auto Pac-Man</button>
        <button type="button" class="toggle" data-ai-toggle="pacmanNn" aria-pressed="true">Pac-Man NN</button>
        <button type="button" class="toggle" data-ai-toggle="pacmanPretrain" aria-pressed="true">Warm Start</button>
        <button type="button" class="toggle" data-ai-toggle="pacmanLogs" aria-pressed="true">Pac-Man Logs</button>
        <button type="button" class="toggle" data-ai-toggle="persistentMemory" aria-pressed="true">Persistent Memory</button>
        <button type="button" class="toggle" data-ai-toggle="adaptiveDifficulty" aria-pressed="true">Adaptive Pressure</button>
        <button type="button" class="toggle" data-ai-toggle="groupTactics" aria-pressed="true">Group Tactics</button>
        <button type="button" class="toggle" data-ai-toggle="powerPelletNerf" aria-pressed="true">Pellet Nerf</button>
        <button type="button" class="toggle" data-ai-toggle="antiLoopTraps" aria-pressed="true">Anti-loop</button>
        <button type="button" class="toggle" data-ai-toggle="tunnelTraps" aria-pressed="true">Tunnel Traps</button>
        <button type="button" class="toggle" data-ai-toggle="speedBursts" aria-pressed="true">Speed Bursts</button>
        <button type="button" class="toggle" data-ai-toggle="levelScaling" aria-pressed="true">Level Scaling</button>
      </div>

      <div class="ai-stats" aria-label="AI learning status">
        <div>Pressure <strong id="ai-pressure">0</strong></div>
        <div>Horizon <strong id="ai-horizon">8</strong></div>
        <div>Memory <strong id="ai-memory">0</strong></div>
        <div>NN Samples <strong id="ai-nn-samples">0</strong></div>
        <div>NN Loss <strong id="ai-nn-loss">-</strong></div>
        <div>Pac Samples <strong id="pac-nn-samples">0</strong></div>
        <div>Pac Reward <strong id="pac-nn-reward">-</strong></div>
        <div>Pretrain <strong id="pac-nn-pretrain">0</strong></div>
      </div>
    </section>

    <canvas id="game" width="672" height="744" aria-label="Mini Maze Muncher game board"></canvas>

    <p class="help">
      Move with arrow keys or WASD. Eat all pellets, avoid ghosts, and use power pellets to hunt them.
      On touch screens, swipe on the board.
    </p>
  </main>

  <script src="game.js?v=9"></script>
</body>
</html>
